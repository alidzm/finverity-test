name: program-capacity

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: info
  DATABASE_URL: postgres://capacity:capacity@postgres:5432/capacity
  # Tokens are requested from the host (localhost:8080); Keycloak pins its issuer to that URL.
  AUTH_ISSUER: http://localhost:8080/realms/capacity
  AUTH_AUDIENCE: capacity-service
  AUTH_JWKS_URI: http://keycloak:8080/realms/capacity/protocol/openid-connect/certs
  KAFKA_BROKERS: kafka:19092
  SWAGGER_ENABLED: "true"
  DEV_UI_ENABLED: "true"

x-app-image: &app-image
  image: program-capacity-service:local
  build: .

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: capacity
      POSTGRES_PASSWORD: capacity
      POSTGRES_DB: capacity
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capacity -d capacity"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 15s

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes: ["./docker/kafka/create-topics.sh:/scripts/create-topics.sh:ro"]
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["8080:8080"]
    volumes: ["./docker/keycloak/capacity-realm.json:/opt/keycloak/data/import/capacity-realm.json:ro"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  migrate:
    <<: *app-image
    command: ["node", "dist/migrate.js"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  app:
    <<: *app-image
    environment: *app-env
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
